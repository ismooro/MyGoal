<style>
:root{box-sizing:border-box;color-scheme:dark;--bg:#0c111b;--sf:#161e2e;--sf2:#212c44;--tx:#e8edf6;--mu:#93a0ba;--ok:#34d399;--ko:#f87171;--M:#a78bfa;--P:#38bdf8;--S:#fbbf24;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*,*::before,*::after{box-sizing:inherit;-webkit-tap-highlight-color:transparent}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;height:100%;display:flex;flex-direction:column;background:var(--bg);color:var(--tx);font:16px/1.45 -apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,sans-serif;touch-action:manipulation;-webkit-text-size-adjust:100%}
button{font:inherit;color:inherit;cursor:pointer;touch-action:manipulation;transition:transform .1s,background .15s}
button:active{transform:scale(.97)}
header{display:flex;justify-content:space-between;align-items:center;padding:10px 18px}
header b{font-size:19px}
#sk{background:var(--sf2);border-radius:20px;padding:6px 12px;font-weight:600;font-size:14px}
main{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:4px 16px 20px;max-width:640px;width:100%;margin:0 auto}
nav{display:flex;gap:8px;padding:8px 12px;background:var(--sf);border-top:1px solid var(--sf2)}
nav button{flex:1;min-height:52px;border:0;border-radius:14px;background:transparent;color:var(--mu);font-weight:600}
nav button.on{background:var(--sf2);color:var(--tx)}
h1{font-size:32px;margin:8px 0 2px}
.mu{color:var(--mu);font-size:14px;margin:4px 0}
.seg{display:flex;gap:3px;margin:12px 0}
.s{flex:1;height:8px;border-radius:4px;background:var(--c);opacity:.28}
.s.cur{opacity:1}.s.ok{background:var(--ok);opacity:1}.s.ko{background:var(--ko);opacity:1}
.row{display:flex;gap:8px;margin:12px 0}
.row div{flex:1;padding:10px 6px;text-align:center;background:var(--sf);border-top:3px solid var(--c);border-radius:10px;font-size:14px}
.tag{display:inline-block;color:var(--c);font-weight:700;font-size:14px}
.q{font-size:19px;line-height:1.4;font-weight:600;margin:6px 0 10px}
.o{display:block;width:100%;min-height:52px;text-align:left;padding:12px 14px;margin:8px 0;background:var(--sf);border:1.5px solid var(--sf2);border-radius:14px}
.o.ok{border-color:var(--ok);background:rgba(52,211,153,.15)}
.o.ko{border-color:var(--ko);background:rgba(248,113,113,.15)}
.o:disabled{color:var(--tx);cursor:default}
.ex{margin:12px 0;padding:12px 14px;background:var(--sf);border-left:4px solid var(--c);border-radius:10px;font-size:15px}
.btn{display:block;width:100%;min-height:54px;margin:14px 0;border:0;border-radius:14px;background:var(--tx);color:var(--bg);font-weight:700;font-size:17px}
.btn.g{background:var(--sf2);color:var(--tx)}
.chips{display:flex;gap:6px;overflow-x:auto;padding:2px 0}
.ch{min-height:48px;padding:0 16px;border-radius:24px;border:1.5px solid var(--sf2);background:transparent;white-space:nowrap}
.ch.on{background:var(--tx);color:var(--bg);border-color:var(--tx)}
.fc{perspective:1000px;-webkit-perspective:1000px;height:min(360px,52vh);margin:10px 0}
.in{position:relative;width:100%;height:100%;transition:transform .5s;transform-style:preserve-3d;-webkit-transform-style:preserve-3d}
.in.fl{transform:rotateY(180deg)}
.face{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:center;gap:8px;padding:20px;overflow:auto;background:var(--sf);border:1.5px solid var(--c);border-radius:20px;backface-visibility:hidden;-webkit-backface-visibility:hidden}
.face.b{transform:rotateY(180deg);font-size:16px}
.face h2{font-size:22px;margin:0}
.rt{display:flex;gap:8px}
.rt[hidden]{display:none}
.rt button{flex:1;min-height:52px;border:0;border-radius:14px;font-weight:700}
[data-r="0"]{background:#3b1d24;color:var(--ko)}[data-r="1"]{background:#3a3015;color:var(--S)}[data-r="2"]{background:#12342b;color:var(--ok)}
main h2{font-size:20px;margin:22px 0 8px}
.rule{position:relative;height:20px;border-radius:6px;background:var(--sf2);overflow:hidden}
.rule i{display:block;height:100%;background:var(--P);transition:width .6s}
.rule.c i{background:var(--ok)}
.rule::after{content:"";position:absolute;left:0;top:0;right:0;bottom:0;background:repeating-linear-gradient(90deg,transparent 0 9px,rgba(12,17,27,.6) 9px 10px)}
#bg,#fx{position:fixed;left:0;top:0;width:100%;height:100%;pointer-events:none}
#bg{z-index:-1}#fx{z-index:60}
#snd{min-width:48px;min-height:48px;border:0;background:transparent;font-size:22px}
.o:not(:disabled):hover{border-color:var(--P);transform:translateX(4px);box-shadow:0 0 18px -6px var(--P)}
.o.ok{animation:pl .5s}.o.ko{animation:sk .4s}.q{animation:in .3s both}.s.cur{animation:bl 1.1s infinite}.rule i{animation:fl .9s ease-out}
.pop{position:fixed;z-index:70;pointer-events:none;font-weight:800;font-size:22px;text-shadow:0 2px 10px #000;animation:up 1s ease-out forwards}
.toast{position:fixed;left:50%;top:calc(env(safe-area-inset-top,0px) + 64px);z-index:80;pointer-events:none;white-space:nowrap;padding:10px 18px;border-radius:999px;background:var(--sf2);border:1.5px solid var(--S);font-weight:700;animation:tt 2.5s both}
@keyframes pl{50%{transform:scale(1.04);box-shadow:0 0 26px rgba(52,211,153,.55)}}
@keyframes sk{25%{transform:translateX(-7px)}75%{transform:translateX(7px)}}
@keyframes in{from{opacity:0;transform:translateY(8px)}}
@keyframes bl{50%{opacity:.45}}
@keyframes fl{from{width:0}}
@keyframes up{from{transform:translate(-50%,-50%) scale(.6)}20%{transform:translate(-50%,-90%) scale(1.15)}to{transform:translate(-50%,-230%);opacity:0}}
@keyframes tt{0%{opacity:0;transform:translate(-50%,-12px)}12%,80%{opacity:1;transform:translate(-50%,0)}100%{opacity:0}}
:root{--mf:"STIX Two Text","Noto Sans Math","Cambria Math",STIXGeneral,Georgia,"Times New Roman",serif}
.q,.o,.ex,.face{font-family:var(--mf);font-kerning:normal;text-rendering:optimizeLegibility}
.q{font-size:21px;font-weight:500;line-height:1.45}
.o{font-size:18px;line-height:1.4}
.ex{font-size:17px;line-height:1.55}
.face,.face.b{font-size:18px;line-height:1.5}
.face h2{font-size:24px;line-height:1.3}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

<script>
/* Banque QCM : [matière, question, [options (la bonne en premier, mélangées à l’affichage)], 0, explication] */
const Q=[
["M", "$f$ est $2\\pi$-périodique et impaire. Que valent ses coefficients de Fourier $a_n$ ($n\\geq0$) ?", ["$a_n=0$ pour tout $n$", "$b_n=0$ pour tout $n$", "$a_n=b_n$", "$a_0=\\pi$"], 0, "<b>Méthode :</b> $f(t)\\cos(nt)$ est impaire, son intégrale sur $[-\\pi,\\pi]$ est nulle ($a_0$ compris). Seuls les $b_n$ restent. <b>Piège jury :</b> tracer une courbe réellement impaire et justifier la parité."],
["M", "Dirichlet : $f$ est $2\\pi$-périodique, $C^1$ par morceaux, avec un saut en $t_0$. Vers quoi converge $S(t_0)$ ?", ["$\\dfrac{f(t_0^+)+f(t_0^-)}{2}$", "$f(t_0^+)$", "$f(t_0)$", "$0$"], 0, "La série converge partout : vers f(t) en un point de continuité, vers la moyenne des limites en un saut. <b>Piège jury :</b> la convergence aux discontinuités est souvent mal comprise."],
["M", "Avec $a_n=0$ et $b_n=\\frac1n$ pour $f(t)=\\frac{\\pi-t}{2}$ sur $]0,\\pi[$ (impaire), Parseval donne $\\frac12\\sum b_n^2=\\frac{1}{2\\pi}\\int_{-\\pi}^{\\pi}f^2$. Que vaut $\\sum_{n\\geq1}\\frac1{n^2}$ ?", ["$\\dfrac{\\pi^2}{6}$", "$\\dfrac{\\pi^2}{12}$", "$\\dfrac{\\pi^2}{8}$", "$\\dfrac{\\pi^2}{3}$"], 0, "$\\frac{1}{2\\pi}\\int_{-\\pi}^{\\pi}f^2=\\frac1\\pi\\int_0^\\pi\\frac{(\\pi-t)^2}{4}\\,dt=\\frac{\\pi^2}{12}$, donc $\\frac12\\sum\\frac1{n^2}=\\frac{\\pi^2}{12}$ et $\\sum\\frac1{n^2}=\\frac{\\pi^2}{6}$. <b>Piège :</b> oublier le facteur $\\frac12$ devant $\\sum(a_n^2+b_n^2)$."],
["M", "$A$ est la matrice $3\\times3$ dont tous les coefficients valent $1$ sauf la diagonale (nulle). Ses valeurs propres ?", ["$-1$ (double) et $2$", "$1$ (double) et $-2$", "$0$ et $3$", "$-1$, $1$ et $2$"], 0, "$A=B-I$, avec $B$ = matrice de $1$ (rang 1, trace 3) : $\\mathrm{Sp}(B)=\\{0,0,3\\}$ donc $\\mathrm{Sp}(A)=\\{-1,-1,2\\}$. <b>Piège jury :</b> inversible ≠ diagonalisable ; donner une base de chaque sous-espace propre, pas seulement le rang."],
["M", "Pour développer $(B-I)^n$ avec le binôme de Newton, que faut-il justifier ?", ["$B$ et $I$ commutent", "$B$ est inversible", "$B$ est symétrique", "$B$ est diagonalisable"], 0, "$I$ commute avec toute matrice, donc $B$ et $-I$ commutent et $A^n=\\sum_{k=0}^{n}\\binom{n}{k}(-1)^{n-k}B^k$. <b>Piège jury :</b> cette justification est exigée et souvent oubliée."],
["M", "Développement de $c_n=\\left(1+\\frac1n\\right)^n$ quand $n\\to+\\infty$ ?", ["$e-\\dfrac{e}{2n}+o\\!\\left(\\dfrac1n\\right)$", "$e+\\dfrac{e}{2n}+o\\!\\left(\\dfrac1n\\right)$", "$e-\\dfrac{e}{n}+o\\!\\left(\\dfrac1n\\right)$", "$1+\\dfrac1n+o\\!\\left(\\dfrac1n\\right)$"], 0, "$c_n=\\exp\\left(n\\ln(1+h)\\right)$, $h=\\frac1n\\to0$ : $n\\ln(1+h)=1-\\frac h2+o(h)$, puis $e^{1+u}=e\\,(1+u+\\dots)$. <b>Piège jury :</b> on ne compose des DL qu’au voisinage de 0."],
["M", "Solution générale de $y''+2y'+5y=0$ ?", ["$e^{-x}(A\\cos2x+B\\sin2x)$", "$e^{-x}(A\\cos5x+B\\sin5x)$", "$Ae^{-x}+Be^{-5x}$", "$(A+Bx)e^{-x}$"], 0, "$r^2+2r+5=0$, $\\Delta=-16&lt;0$, $r=-1\\pm2i$. $\\Delta&gt;0$ : deux exponentielles ; $\\Delta=0$ : $(A+Bx)e^{rx}$."],
["M", "Résoudre $y'+2y=4$ avec $y(0)=0$.", ["$y=2\\left(1-e^{-2x}\\right)$", "$y=2e^{-2x}$", "$y=4\\left(1-e^{-2x}\\right)$", "$y=2\\left(e^{2x}-1\\right)$"], 0, "Homogène : $Ce^{-2x}$ ; particulière constante : $2$ ; $y(0)=0\\Rightarrow C=-2$. <b>Réflexe :</b> réinjecter dans l’équation et la condition initiale."],
["P", "Plan infini uniformément chargé ($\\sigma$) : champ à la distance $z>0$ ?", ["$\\dfrac{\\sigma}{2\\varepsilon_0}$ selon $+\\vec e_z$, indépendant de $z$", "$\\dfrac{\\sigma}{\\varepsilon_0}$ selon $+\\vec e_z$", "$\\dfrac{\\sigma}{2\\varepsilon_0z}$ selon $+\\vec e_z$", "$0$"], 0, "Invariances en $x,y\\Rightarrow\\vec E=\\vec E(z)$ ; plans de symétrie $(M,\\vec e_x,\\vec e_z)$ et $(M,\\vec e_y,\\vec e_z)\\Rightarrow\\vec E\\parallel\\vec e_z$ ; Gauss sur un cylindre de section $S$ : $2ES=\\dfrac{\\sigma S}{\\varepsilon_0}$. <b>Piège jury :</b> citer le plan $(Oxy)$ comme plan de symétrie des charges (pas d’antisymétrie) pour $\\vec E(-z)=-\\vec E(z)$."],
["P", "Condensateur plan, tension $U$ constante, distance $z$, $C(z)=\\dfrac{\\varepsilon_0S}{z}$. Que vaut $F_e=\\dfrac{d}{dz}\\left(\\frac12CU^2\\right)$ ?", ["$-\\dfrac{\\varepsilon_0SU^2}{2z^2}$ : attractive", "$+\\dfrac{\\varepsilon_0SU^2}{2z^2}$ : répulsive", "$-\\dfrac{\\varepsilon_0SU^2}{2z}$ : attractive", "$\\dfrac{\\varepsilon_0SU^2}{z}$ : attractive"], 0, "$\\dfrac{d}{dz}\\left(\\dfrac{\\varepsilon_0SU^2}{2z}\\right)=-\\dfrac{\\varepsilon_0SU^2}{2z^2}$ selon $\\vec e_z$ : la force tend à réduire $z$, elle est attractive. À l’équilibre : $mg=\\dfrac{\\varepsilon_0SU^2}{2z^2}$. <b>Piège :</b> justifier « attractive »."],
["P", "Charge d’un circuit RC sous un échelon $E$ : que vaut $u$ à $t=\\tau=RC$ ?", ["$\\approx0{,}63\\,E$", "$\\approx0{,}37\\,E$", "$\\approx0{,}95\\,E$", "$E$"], 0, "$u(t)=E\\left(1-e^{-t/\\tau}\\right)$ donc $u(\\tau)=E\\left(1-\\frac1e\\right)\\approx0{,}63\\,E$ ; à $3\\tau$ : 95 %. <b>Piège jury :</b> justifier $u(0^+)=0$ par continuité de la tension aux bornes du condensateur."],
["P", "Passe-bas d’ordre 1, $H=\\dfrac{1}{1+j\\omega/\\omega_0}$ : pente en haute fréquence et gain en $\\omega_0$ ?", ["−20 dB/décade ; −3 dB", "−40 dB/décade ; −3 dB", "−20 dB/décade ; 0 dB", "+20 dB/décade ; −3 dB"], 0, "$|H|=\\dfrac{1}{\\sqrt{1+(\\omega/\\omega_0)^2}}$ : $\\dfrac{1}{\\sqrt2}$ ($-3$ dB) en $\\omega_0$, $\\approx\\dfrac{\\omega_0}{\\omega}$ en HF. Phase de $0$ à $-90^\\circ$ ($-45^\\circ$ en $\\omega_0$). <b>Piège jury :</b> le $j$ ne doit plus apparaître dans le module."],
["P", "Poussée d’Archimède sur un cylindre ($R=2$ cm, $h=4$ cm) dans l’air ($\\rho\\approx1\\ \\mathrm{kg\\cdot m^{-3}}$) : ordre de grandeur ?", ["$\\approx5\\times10^{-4}$ N", "$\\approx5\\times10^{-2}$ N", "$\\approx5\\times10^{-6}$ N", "$\\approx0{,}5$ N"], 0, "$\\Pi=\\rho_{\\text{air}}Vg$, $V=\\pi R^2h\\approx5\\times10^{-5}$ m³ $\\Rightarrow\\Pi\\approx5\\times10^{-4}$ N, soit ≈ 50 mg, bien au-dessus de 10 µg : à corriger. <b>Piège jury :</b> volume du cylindre inhomogène, résultat laissé en fraction au lieu de l’écriture scientifique."],
["P", "Tige de longueur $a$ glissant à $v_0$ sur des rails, champ $B_0$ uniforme perpendiculaire au circuit : $|e|$ ?", ["$aB_0v_0$", "$\\dfrac{B_0v_0}{a}$", "$aB_0v_0^2$", "$\\dfrac{aB_0}{v_0}$"], 0, "$\\Phi=B_0\\,a\\,(L_0+v_0t)$ avec la normale cohérente avec le courant orienté ; $e=-\\dfrac{d\\Phi}{dt}\\Rightarrow|e|=aB_0v_0$. <b>Piège jury :</b> représenter la normale au circuit ; $L_0$ est constante, sa dérivée n’est pas $v_0$."],
["P", "Gaz parfait, transformation isotherme : pourquoi $\\Delta U=0$ ?", ["$U$ ne dépend que de $T$ (1re loi de Joule), donc $Q=-W$", "Parce que $Q=0$", "Parce que $W=0$", "Parce que $P$ est constante"], 0, "1er principe : $\\Delta U=W+Q$ (système fermé). Isotherme réversible : $W=-nRT\\ln\\dfrac{V_2}{V_1}$, $Q=-W$. Adiabatique réversible : $PV^\\gamma=\\mathrm{cte}$."],
["P", "Théorème d’Ampère : champ $\\vec B$ à la distance $r$ d’un fil infini parcouru par $I$ ?", ["$\\dfrac{\\mu_0I}{2\\pi r}$", "$\\dfrac{\\mu_0I}{4\\pi r^2}$", "$\\dfrac{\\mu_0I}{2\\pi r^2}$", "$\\mu_0I\\cdot2\\pi r$"], 0, "$\\oint\\vec B\\cdot d\\vec l=\\mu_0I_{\\text{enlacé}}$ sur un cercle de rayon $r$ : $B\\cdot2\\pi r=\\mu_0I$, $\\vec B$ orthoradial. <b>Méthode :</b> symétries, invariances, contour orienté, courant enlacé algébrique."],
["S", "Retour unitaire, correcteur $K_p$, système $H(p)=\\dfrac{G}{1+\\tau p}$. Constante de temps de la FTBF ?", ["$\\dfrac{\\tau}{1+K_pG}$", "$\\tau(1+K_pG)$", "$\\tau$", "$\\dfrac{\\tau}{K_p}$"], 0, "$\\mathrm{FTBO}=\\dfrac{K_pG}{1+\\tau p}\\Rightarrow\\mathrm{FTBF}=\\dfrac{\\frac{K_pG}{1+K_pG}}{1+\\frac{\\tau}{1+K_pG}\\,p}$. $K_p$ grand : plus rapide et erreur plus faible. <b>Piège jury :</b> lire le schéma-bloc avec soin (retour, signe du comparateur)."],
["S", "Classe 0, gain statique de la FTBO $=K$, retour unitaire, échelon unitaire : erreur statique ?", ["$\\dfrac{1}{1+K}$", "$\\dfrac{K}{1+K}$", "$0$", "$\\dfrac1K$"], 0, "$\\varepsilon=\\lim_{p\\to0}p\\,E(p)$, $E=\\dfrac{1}{p\\,(1+\\mathrm{FTBO})}\\Rightarrow\\varepsilon=\\dfrac{1}{1+K}$. Pour l’annuler : ajouter une intégration (correcteur intégral)."],
["S", "Dénominateur de la FTBF : $p^3+2p^2+3p+K$. Stabilité (Routh) ?", ["$0<K<6$", "$K>6$", "$0<K<3$", "$K<0$"], 0, "Colonne de Routh : $1$ ; $2$ ; $\\dfrac{6-K}{2}$ ; $K$. Tous positifs $\\Leftrightarrow0&lt;K&lt;6$. <b>Rappel :</b> stable ⇔ pôles à partie réelle strictement négative."],
["S", "Comment lit-on la marge de phase ?", ["180° + arg FTBO à la pulsation où |FTBO| = 0 dB", "−arg FTBO quand arg = −180°", "|FTBO| quand arg = 0°", "À la coupure de la FTBF"], 0, "$M_\\varphi=180^\\circ+\\varphi(\\omega_{c0})$ avec $|\\mathrm{FTBO}(j\\omega_{c0})|=1$. Critère usuel : $M_\\varphi\\geq45^\\circ$ (marge de gain $\\geq10$ dB)."],
["S", "Temps de réponse à 5 % d’un 1er ordre de constante de temps $\\tau$ ?", ["$\\approx3\\tau$", "$\\approx\\tau$", "$\\approx5\\tau$", "$\\approx0{,}63\\tau$"], 0, "À $3\\tau$ : $1-e^{-3}\\approx95$ % de la valeur finale. En boucle fermée : $t_{5\\%}=\\dfrac{3\\tau}{1+K_pG}$. <b>Piège :</b> vérifier les unités et comparer à l’exigence du cahier des charges."],
["S", "Deux liaisons en parallèle entre 0 et 1 : liaison équivalente ?", ["Intersection des torseurs cinématiques (ou somme des torseurs statiques)", "Somme des torseurs cinématiques", "Produit des torseurs statiques", "La liaison de plus faible degré"], 0, "En parallèle, le mouvement relatif doit satisfaire les deux liaisons (intersection cinématique) ; les actions s’additionnent. <b>Piège :</b> exprimer les torseurs au même point ($\\vec M_B=\\vec M_A+\\overrightarrow{BA}\\wedge\\vec R$)."],
["S", "$E_c=\\frac12J_m\\omega_m^2+\\frac12J_v\\omega_v^2+\\frac12M\\dot x^2$, $\\omega_v=r\\,\\omega_m$, $\\dot x=k\\,\\omega_m$. Inertie équivalente ramenée au moteur ?", ["$J_m+r^2J_v+Mk^2$", "$J_m+J_v+M$", "$J_m+\\dfrac{J_v}{r^2}+\\dfrac{M}{k^2}$", "$J_mr^2+J_v+Mk$"], 0, "Par identification avec $\\frac12J_{eq}\\omega_m^2$ : $J_{eq}=J_m+r^2J_v+Mk^2$. Puis TEC : $J_{eq}\\dot\\omega_m=C_m-C_r$. <b>Piège jury :</b> contrôler l’homogénéité (kg·m²)."],
["S", "Onduleur triphasé pleine onde sous $E$ : valeurs possibles de la tension simple $v_1$ ?", ["$\\pm\\dfrac{E}{3}$ et $\\pm\\dfrac{2E}{3}$", "$0$ et $E$", "$\\pm\\dfrac{E}{2}$", "$\\pm E$ et $0$"], 0, "$u_{12}\\in\\{0,\\pm E\\}$ et $v_1=\\dfrac{u_{12}-u_{31}}{3}\\Rightarrow\\pm\\dfrac{E}{3}$ ou $\\pm\\dfrac{2E}{3}$. <b>Piège :</b> $T_x$ et $T_x'$ jamais fermés ensemble (court-circuit de la source)."]
];
/* Flashcards : [matière, recto, verso] */
const C=[
["M", "Théorème de Dirichlet", "$f$ $2\\pi$-périodique, $C^1$ par morceaux $\\Rightarrow S(t)$ converge vers $\\dfrac{f(t^+)+f(t^-)}{2}$ ; $=f(t)$ aux points de continuité.<br><b>Usage :</b> $S(\\pi/2)$ donne $\\sum_{p=0}^{\\infty}\\dfrac{(-1)^p}{2p+1}=\\dfrac\\pi4$."],
["M", "Identité de Parseval", "$f$ $2\\pi$-périodique, continue par morceaux :<br>$a_0^2+\\frac12\\sum\\left(a_n^2+b_n^2\\right)=\\dfrac{1}{2\\pi}\\displaystyle\\int_{-\\pi}^{\\pi}f^2$.<br><b>Usage :</b> $\\sum\\dfrac{1}{n^2}=\\dfrac{\\pi^2}{6}$."],
["M", "Coefficients de Fourier", "$a_0$ = valeur moyenne ; $a_n=\\dfrac1\\pi\\displaystyle\\int_{-\\pi}^{\\pi}f(t)\\cos(nt)\\,dt$ ; $b_n=\\dfrac1\\pi\\displaystyle\\int_{-\\pi}^{\\pi}f(t)\\sin(nt)\\,dt$ (période $2\\pi$).<br>$f$ paire $\\Rightarrow b_n=0$ ; $f$ impaire $\\Rightarrow a_n=0$ et $a_0=0$."],
["M", "DL usuels en 0", "$e^x=1+x+\\dfrac{x^2}{2}+o(x^2)$<br>$\\ln(1+x)=x-\\dfrac{x^2}{2}+o(x^2)$<br>$\\sin x=x-\\dfrac{x^3}{6}+o(x^3)$ ; $\\cos x=1-\\dfrac{x^2}{2}+o(x^2)$<br><b>Attention :</b> composer seulement si l’argument tend vers 0."],
["M", "Diagonalisation", "$A$ diagonalisable $\\Leftrightarrow\\sum\\dim E_\\lambda=n$ (polynôme caractéristique scindé, $\\dim E_\\lambda$ = multiplicité).<br>$n$ valeurs propres distinctes $\\Rightarrow$ diagonalisable.<br><b>Piège :</b> diagonalisable ≠ inversible."],
["M", "Suites adjacentes", "$u_n$ croissante, $v_n$ décroissante, $v_n-u_n\\to0\\Rightarrow$ même limite $\\ell$, $u_n\\leq\\ell\\leq v_n$.<br><b>Piège jury :</b> tester les premiers termes ne prouve rien ; étudier le signe de $u_{n+1}-u_n$."],
["P", "Théorème de Gauss : méthode", "$\\oint_S\\vec E\\cdot d\\vec S=\\dfrac{Q_{int}}{\\varepsilon_0}$.<br>1) symétries 2) invariances 3) surface de Gauss 4) flux 5) $Q_{int}$.<br>Plan infini : $\\dfrac{\\sigma}{2\\varepsilon_0}$ ; condensateur plan : $\\dfrac{\\sigma}{\\varepsilon_0}$ entre les plaques, $0$ dehors ; $C=\\dfrac{\\varepsilon_0S}{d}$."],
["P", "Loi de Faraday et normale", "$e=-\\dfrac{d\\Phi}{dt}$, $\\Phi=\\displaystyle\\iint\\vec B\\cdot\\vec n\\,dS$.<br>La normale $\\vec n$ est liée au sens du courant (main droite). <b>Piège jury :</b> la dessiner. Lenz : le courant induit s’oppose à la cause."],
["P", "RC en régime sinusoïdal forcé", "$Z_R=R$, $Z_C=\\dfrac{1}{jC\\omega}$.<br>$\\underline u=\\dfrac{\\underline e}{1+jRC\\omega}\\Rightarrow U_0=\\dfrac{E_0}{\\sqrt{1+(RC\\omega)^2}}$.<br>Si $RC\\omega\\gg1$ : $U_0\\approx\\dfrac{E_0}{RC\\omega}$."],
["P", "1er et 2e principes", "1er : $\\Delta U=W+Q$ (système fermé) ; GP : $dU=nC_v\\,dT$.<br>2e : $\\Delta S=S_{\\text{éch}}+S_{\\text{créée}}$, $S_{\\text{créée}}\\geq0$ ($=0$ si réversible).<br>Adiabatique réversible GP : $PV^\\gamma=\\mathrm{cte}$."],
["P", "Mécanique : PFD, TEC, Archimède", "PFD : $m\\vec a=\\sum\\vec F$. TEC : $\\Delta E_c=\\sum W$.<br>Archimède : $\\Pi=\\rho_{\\text{fluide}}V_{\\text{immergé}}\\,g$, vers le haut.<br>Chute libre : $z=\\frac12gt^2$, $t=\\sqrt{\\dfrac{2d}{g}}$."],
["P", "Incertitudes et compatibilité", "Écart normalisé $=\\dfrac{|x_1-x_2|}{\\sqrt{u_1^2+u_2^2}}$ ; compatible si $&lt;2$.<br>Régression $\\tau=aR+b$ : identifier $a$ et $b$ aux grandeurs physiques ($a=C$)."],
["S", "Asservissement : FTBF et erreur", "$\\mathrm{FTBF}=\\dfrac{\\mathrm{FTBO}}{1+\\mathrm{FTBO}}$ (retour unitaire).<br>Erreur statique à l’échelon : classe 0 $\\to\\dfrac{1}{1+K}$ ; classe $\\geq1\\to0$.<br>Laplace, conditions de Heaviside : $\\dfrac{dy}{dt}\\to pY(p)$."],
["S", "Stabilité et marges", "Stable $\\Leftrightarrow$ pôles de la FTBF à partie réelle $&lt;0$ (Routh : première colonne de même signe).<br>$M_\\varphi=180^\\circ+\\varphi(\\omega_{c0})\\geq45^\\circ$ ; marge de gain $\\geq10$ dB."],
["S", "Fermeture géométrique", "Cycle OABO : $\\overrightarrow{OA}+\\overrightarrow{AB}+\\overrightarrow{BO}=\\vec0$, projeté sur $\\vec x_0$ et $\\vec y_0\\Rightarrow$ 2 équations scalaires.<br>$P\\cos\\theta+Q\\sin\\theta=R\\Rightarrow\\cos(\\theta-\\psi)=\\dfrac{R}{\\sqrt{P^2+Q^2}}$."],
["S", "Torseurs et liaisons", "Statique : $\\vec M_B=\\vec M_A+\\overrightarrow{BA}\\wedge\\vec R$. Cinématique : $\\vec V_B=\\vec V_A+\\overrightarrow{BA}\\wedge\\vec\\Omega$.<br>Parallèle : cinématique = intersection, statique = somme. Série : l’inverse."],
["S", "Coussinets : pression et vitesse", "$p=\\dfrac{F_R}{d\\cdot b}$ (surface projetée) $\\leq p_{\\max}$.<br>$v=\\omega\\dfrac d2=\\dfrac{\\pi Nd}{60}$ ($N$ en tr/min) $\\leq v_{\\max}$.<br>$F_R=\\dfrac F4$ pour 4 bielles."],
["S", "Cadence, énergétique, onduleur", "$t_{\\text{cycle}}$ (s) $=\\dfrac{3600\\times\\text{pièces par cycle}}{\\text{cadence (pièces/h)}}$. <b>Piège jury :</b> cadence ≠ temps de cycle ; ne pas oublier le retour des éjecteurs.<br>TEC : $J_{eq}\\dot\\omega=C_m-C_r$ ; $J=\\dfrac{mR^2}{2}$.<br>Onduleur : $v_1=\\dfrac{u_{12}-u_{31}}{3}$."]
];

 return`<h1>Niveau ${i+1}</h1><p class="mu">${c[1]} · ${st.xp} XP</p><div class="rule"><i style="width:${p}%"></i></div><p class="mu">${nx?"Prochain palier, "+nx[1]+" : encore "+(nx[0]-st.xp)+" XP.":"Palier maximal atteint."}</p><h2>Distance CentraleSupélec</h2><div class="rule c"><i style="width:${cs}%"></i></div><p class="mu">${cs} % du chemin${cs>=100?". Tu es au niveau visé, maintiens-le.":", encore "+(LV[8][0]-st.xp)+" XP."}</p><h2>Réussite par matière</h2><div class="row">${["M","P","S"].map(s=>{const a=st.t[s][0],b=st.t[s][1];return`<div style="--c:var(--${s})">${NM[s]}<br><b>${b?Math.round(a/b*100)+" %":"–"}</b></div>`}).join("")}</div><p class="mu">${tot} réponse${tot>1?"s":""} · ${st.n} journée${st.n>1?"s":""} complète${st.n>1?"s":""} · série en cours : ${live()}.</p><p class="mu">+10 XP par bonne réponse, bonus de série (jusqu’à +35) et +25 pour un 15/15. Indicateur d’entraînement personnel, pas un classement officiel.</p>`}
function tx(){if(!v.textContent.includes('$')){v.style.transition='none';v.style.opacity=1;return}const w=window.MathJax;if(!(w&&w.typesetPromise)){v.style.opacity=0;setTimeout(()=>{v.style.opacity=1},2500);return}v.style.transition='none';v.style.opacity=0;const f=()=>{v.style.transition='opacity .18s';v.style.opacity=1},T=setTimeout(f,1500);w.typesetClear&&w.typesetClear();w.typesetPromise([v]).catch(()=>{}).then(()=>{clearTimeout(T);f()})}

const bg=$('#bg'),fx=$('#fx'),bx=bg.getContext('2d'),fq=fx.getContext('2d'),RM=matchMedia('(prefers-reduced-motion: reduce)').matches,CL={M:'167,139,250',P:'56,189,248',S:'251,191,36'},HX=['#a78bfa','#38bdf8','#fbbf24'],GL=[['∫','M'],['Σ','M'],['π','M'],['∞','M'],['√','M'],['ω','P'],['∇','P'],['Φ','P'],['ε₀','P'],['μ₀','P'],['H(p)','S'],['Δ','S'],['τ','S'],['θ','S']];
let W,H,mx=.5,my=.5,sx=.5,sy=.5,G=[],S=[],P=[],raf,cb=0,AC,mute=ld('ats_m',0);
function size(){const d=Math.min(devicePixelRatio||1,2),r=Math.random;W=innerWidth;H=innerHeight;for(const c of[bg,fx]){c.width=W*d;c.height=H*d}bx.setTransform(d,0,0,d,0,0);fq.setTransform(d,0,0,d,0,0);G=Array.from({length:Math.min(28,Math.floor(W*H/32000))},()=>({g:GL[Math.floor(r()*GL.length)],x:r()*W,y:r()*H,z:.5+r()*.8,a:r()*6.28,v:.12+r()*.2}));S=Array.from({length:70},()=>({x:r()*W,y:r()*H,z:.6+r()*1.4,p:r()*6.28}))}
const glow=(x,y,c,a)=>{const g=bx.createRadialGradient(x,y,0,x,y,Math.max(W,H)*.6);g.addColorStop(0,'rgba('+c+','+a+')');g.addColorStop(1,'rgba('+c+',0)');bx.fillStyle=g;bx.fillRect(0,0,W,H)};
function frame(t){sx+=(mx-sx)*.05;sy+=(my-sy)*.05;bx.clearRect(0,0,W,H);glow(W*(.25+.5*sx),H*(.2+.3*sy),CL.M,.17);glow(W*(.85-.5*sx),H*(.9-.3*sy),CL.P,.13);for(const s of S){bx.fillStyle='rgba(232,237,246,'+(.3+.3*Math.sin(t/900+s.p))+')';bx.fillRect(((s.x-(sx-.5)*40*s.z)%W+W)%W,((s.y-(sy-.5)*40*s.z)%H+H)%H,s.z,s.z)}bx.textAlign='center';for(const o of G){if(!RM){o.y-=o.v*o.z;o.a+=.003}if(o.y<-40){o.y=H+40;o.x=Math.random()*W}bx.save();bx.translate(o.x-(sx-.5)*70*o.z,o.y-(sy-.5)*70*o.z);bx.rotate(Math.sin(o.a)*.4);bx.font=Math.round(30*o.z)+'px "STIX Two Text","Noto Sans Math",Georgia,serif';bx.fillStyle='rgba('+CL[o.g[1]]+','+(.1+.1*o.z)+')';bx.fillText(o.g[0],0,0);bx.restore()}fq.clearRect(0,0,W,H);for(let i=P.length-1;i>=0;i--){const p=P[i];p.x+=p.vx;p.y+=p.vy;p.vy+=p.gr;if(--p.l<=0){P.splice(i,1);continue}fq.globalAlpha=p.l/p.m;fq.fillStyle=p.c;fq.beginPath();fq.arc(p.x,p.y,p.s,0,6.283);fq.fill()}fq.globalAlpha=1;if(!RM)raf=requestAnimationFrame(frame)}

size();$('#snd').textContent=mute?'🔇':'🔊';$('#snd').onclick=()=>{mute=mute?0:1;sv('ats_m',mute);$('#snd').textContent=mute?'🔇':'🔊';tone(660,0,.08)};addEventListener('resize',()=>{size();if(RM)frame(0)});addEventListener('pointermove',e=>{mx=e.clientX/W;my=e.clientY/H;if(e.pointerType==='mouse'||e.buttons)trail(e.clientX,e.clientY)},{passive:true});addEventListener('pointerdown',e=>{mx=e.clientX/W;my=e.clientY/H;burst(e.clientX,e.clientY,null,8,3)},{passive:true});document.addEventListener('visibilitychange',()=>{cancelAnimationFrame(raf);if(!document.hidden)frame(0)});frame(0);
