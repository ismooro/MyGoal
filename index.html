<style>

body{margin:0;height:100%;display:flex;flex-direction:column;background:var(--bg);color:var(--tx);font:16px/1.45 -apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,sans-serif;touch-action:manipulation;-webkit-text-size-adjust:100%}

@keyframes bl{50%{opacity:.45}}
@keyframes fl{from{width:0}}
@keyframes up{from{transform:translate(-50%,-50%) scale(.6)}20%{transform:translate(-50%,-90%) scale(1.15)}to{transform:translate(-50%,-230%);opacity:0}}
@keyframes tt{0%{opacity:0;transform:translate(-50%,-12px)}12%,80%{opacity:1;transform:translate(-50%,0)}100%{opacity:0}}
:root{--mf:"STIX Two Text","Noto Sans Math","Cambria Math",STIXGeneral,Georgia,"Times New Roman",serif}
.q,.o,.ex,.face{font-family:var(--mf);font-kerning:normal;text-rendering:optimizeLegibility}

.cp>span:first-child{flex:1}

const NQ=[

["P0a", "Chute libre sans vitesse initiale ($g\\approx10\\ \\mathrm{m\\cdot s^{-2}}$) : vitesse après $3$ s ?", ["$30\\ \\mathrm{m\\cdot s^{-1}}$", "$45\\ \\mathrm{m\\cdot s^{-1}}$", "$15\\ \\mathrm{m\\cdot s^{-1}}$", "$90\\ \\mathrm{m\\cdot s^{-1}}$"], "$v=gt=30\\ \\mathrm{m\\cdot s^{-1}}$. <b>Piège :</b> $\\frac12gt^2=45$ m est la distance parcourue."],
["P0a", "Projectile lancé de $O$ avec $\\vec v_0=v_0(\\cos\\alpha\\,\\vec e_x+\\sin\\alpha\\,\\vec e_y)$, sans frottement, $\\vec g=-g\\vec e_y$. Que vaut $y(t)$ ?", ["$-\\dfrac12gt^2+v_0\\sin\\alpha\\,t$", "$-\\dfrac12gt^2+v_0\\cos\\alpha\\,t$", "$-gt^2+v_0\\sin\\alpha\\,t$", "$v_0\\sin\\alpha\\,t-gt$"], "Intégrer $\\ddot y=-g$ deux fois avec $y(0)=0$ et $\\dot y(0)=v_0\\sin\\alpha$."],
["P0a", "Pour ce projectile, la portée (retour à $y=0$) vaut :", ["$\\dfrac{v_0^2\\sin2\\alpha}{g}$", "$\\dfrac{v_0^2\\sin\\alpha}{g}$", "$\\dfrac{v_0^2\\cos2\\alpha}{g}$", "$\\dfrac{2v_0\\sin\\alpha}{g}$"], "$y=0\\Rightarrow t=\\dfrac{2v_0\\sin\\alpha}{g}$, puis $x=v_0\\cos\\alpha\\,t=\\dfrac{v_0^2\\sin2\\alpha}{g}$."],

["P0b", "En charge sous un échelon $E$, l’intensité vaut :", ["$\\dfrac ER\\,e^{-t/\\tau}$", "$\\dfrac ER\\left(1-e^{-t/\\tau}\\right)$", "$\\dfrac ER\\,e^{t/\\tau}$", "$ER\\,e^{-t/\\tau}$"], "$i=C\\dfrac{du}{dt}=\\dfrac ER\\,e^{-t/\\tau}$, donc $i(0^+)=\\dfrac ER$. <b>Piège :</b> $u_C$ est continue, pas $i$."],

["S0a", "Deux éléments en série de rendements $0{,}9$ et $0{,}8$ : rendement global ?", ["$0{,}72$", "$0{,}85$", "$1{,}7$", "$0{,}1$"], "En série, les rendements se multiplient : $0{,}9\\times0{,}8$."],
["S0a", "Une pompe ($\\eta_p=0{,}6$) entraînée par un moteur ($\\eta_m=0{,}8$) doit fournir $1{,}2$ kW hydrauliques. Puissance électrique absorbée ?", ["$2{,}5$ kW", "$2$ kW", "$1{,}5$ kW", "$0{,}58$ kW"], "$P=\\dfrac{P_{\\text{hyd}}}{\\eta_p\\eta_m}=\\dfrac{1{,}2}{0{,}48}$. <b>Piège :</b> on divise par le produit des rendements."],
["S0b", "Quelle liaison n’autorise qu’une seule rotation autour d’un axe ?", ["Pivot", "Glissière", "Rotule", "Encastrement"], "La pivot a 1 degré de liberté : une rotation, aucune translation."],
["S0b", "Combien de degrés de liberté une glissière laisse-t-elle ?", ["$1$", "$0$", "$2$", "$3$"], "Une seule translation, aucune rotation."],
["S0b", "Une rotule (liaison sphérique) autorise :", ["trois rotations, aucune translation", "une rotation et une translation", "trois translations, aucune rotation", "une rotation seulement"], "Le centre de la rotule est fixe : $3$ rotations, $0$ translation."],

["M0c", "Suite géométrique de premier terme $u_0=2$ et de raison $3$ : $u_4=$ ?", ["$162$", "$24$", "$54$", "$486$"], "$u_n=u_0q^n=2\\times3^4$."],
["M0c", "Limite de $u_n=\\dfrac{3n^2+1}{n^2-2n}$ quand $n\\to+\\infty$ ?", ["$3$", "$0$", "$+\\infty$", "$1$"], "On factorise par le terme dominant $n^2$ en haut et en bas."],

const bg=$('#bg'),fx=$('#fx'),bx=bg.getContext('2d'),fq=fx.getContext('2d'),RM=matchMedia('(prefers-reduced-motion: reduce)').matches,CL={M:'167,139,250',P:'56,189,248',S:'251,191,36'},HX=['#a78bfa','#38bdf8','#fbbf24'],GL=[['∫','M'],['Σ','M'],['π','M'],['∞','M'],['√','M'],['ω','P'],['∇','P'],['Φ','P'],['ε₀','P'],['μ₀','P'],['H(p)','S'],['Δ','S'],['τ','S'],['θ','S']];

function frame(t){sx+=(mx-sx)*.05;sy+=(my-sy)*.05;bx.clearRect(0,0,W,H);glow(W*(.25+.5*sx),H*(.2+.3*sy),CL.M,.17);glow(W*(.85-.5*sx),H*(.9-.3*sy),CL.P,.13);for(const s of S){bx.fillStyle='rgba(232,237,246,'+(.3+.3*Math.sin(t/900+s.p))+')';bx.fillRect(((s.x-(sx-.5)*40*s.z)%W+W)%W,((s.y-(sy-.5)*40*s.z)%H+H)%H,s.z,s.z)}bx.textAlign='center';for(const o of G){if(!RM){o.y-=o.v*o.z;o.a+=.003}if(o.y<-40){o.y=H+40;o.x=Math.random()*W}bx.save();bx.translate(o.x-(sx-.5)*70*o.z,o.y-(sy-.5)*70*o.z);bx.rotate(Math.sin(o.a)*.4);bx.font=Math.round(30*o.z)+'px "STIX Two Text","Noto Sans Math",Georgia,serif';bx.fillStyle='rgba('+CL[o.g[1]]+','+(.1+.1*o.z)+')';bx.fillText(o.g[0],0,0);bx.restore()}fq.clearRect(0,0,W,H);for(let i=P.length-1;i>=0;i--){const p=P[i];p.x+=p.vx;p.y+=p.vy;p.vy+=p.gr;if(--p.l<=0){P.splice(i,1);continue}fq.globalAlpha=p.l/p.m;fq.fillStyle=p.c;fq.beginPath();fq.arc(p.x,p.y,p.s,0,6.283);fq.fill()}fq.globalAlpha=1;if(!RM)raf=requestAnimationFrame(frame)}
const burst=(x,y,c,n,v)=>{if(RM)return;for(let i=0;i<n;i++){const a=Math.random()*6.283,w=(v||5)*(.3+Math.random());P.push({x:x,y:y,vx:Math.cos(a)*w,vy:Math.sin(a)*w-2,gr:.13,l:45+Math.random()*30|0,m:75,s:1.5+Math.random()*2.5,c:c||HX[i%3]})}};
